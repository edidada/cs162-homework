name: CS162 Pregame
on:
  push:
    branches: [edidada/proj-pregame]
  workflow_dispatch:
jobs:
  pregame:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib qemu-system-x86 gdb
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          export PATH="$PWD/proj-pregame/src/utils:$PATH"
          chmod +x proj-pregame/src/utils/pintos*
          make -C proj-pregame/src/utils setitimer-helper
          make -C proj-pregame/src/userprog > evidence/build.txt 2>&1
          cd proj-pregame/src/userprog/build
          for name in do-nothing do-not-much stack-align-v practice-rc; do
            make "tests/userprog/$name.result"
            grep -qx PASS "tests/userprog/$name.result"
          done
          objdump -d tests/userprog/stack-align-v > ../../../../evidence/stack-disassembly.txt
      - name: Remote QEMU GDB trace
        run: |
          set -euo pipefail
          export PATH="$PWD/proj-pregame/src/utils:$PATH"
          root="$PWD"
          cd proj-pregame/src/userprog/build
          pintos --qemu --gdb --filesys-size=2 -p tests/userprog/do-nothing -a do-nothing -- -q -f run do-nothing > "$root/evidence/gdb-qemu.txt" 2>&1 &
          simulation=$!
          trap 'kill "$simulation" 2>/dev/null || true' EXIT
          sleep 2
          timeout 60 gdb -q -batch -x "$root/tests/pregame.gdb" 2>&1 | tee "$root/evidence/gdb-trace.txt"
          wait "$simulation"
          grep -q 'GDB ASSERTIONS PASSED' "$root/evidence/gdb-trace.txt"
          grep -q 'do-nothing: exit(162)' "$root/evidence/gdb-qemu.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pregame-evidence
          path: |
            evidence/
            proj-pregame/src/userprog/build/tests/userprog/*.output
            proj-pregame/src/userprog/build/tests/userprog/*.result
