name: CS162 Rust HTTP
on:
  push:
    branches: [edidada/hw-http-rs]
  workflow_dispatch:
jobs:
  http:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir hw-http-rs/evidence
          git rev-parse HEAD > hw-http-rs/evidence/commit.txt
          cd hw-http-rs
          cargo build --locked 2>&1 | tee evidence/build.txt
          cargo test --locked 2>&1 | tee evidence/tests.txt
          cd ..
          bash tests/http-rs.sh 2>&1 | tee hw-http-rs/evidence/runtime.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rust-http-evidence
          path: hw-http-rs/evidence/
