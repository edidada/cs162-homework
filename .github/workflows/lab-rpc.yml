name: CS162 RPC
on:
  push:
    branches: [edidada/lab-rpc]
  workflow_dispatch:
jobs:
  rpc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y rpcbind rpcsvc-proto libtirpc-dev libglib2.0-dev libnsl-dev
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          sudo service rpcbind start
          make -C lab-rpc 2>&1 | tee evidence/build.txt
          cd lab-rpc
          ./bin/server > ../evidence/server.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 50); do rpcinfo -t localhost 0x20000001 1 && break; sleep .1; done
          test "$(./bin/client example 41)" = 42
          test "$(./bin/client echo 'hello rpc')" = 'hello rpc'
          ./bin/client put key value
          test "$(./bin/client get key)" = value
          gcc -g -I. -I/usr/include/tirpc ../tests/rpc-client.c kv_store_client.c kv_store_clnt.c kv_store_xdr.c -ltirpc -o /tmp/rpc-test
          /tmp/rpc-test | tee ../evidence/runtime.txt
          rpcinfo -p localhost | tee ../evidence/rpcinfo.txt
      - name: Multi-client normal and sanitizer checks
        run: |
          set -euo pipefail
          cd lab-rpc
          gcc -g -I. -I/usr/include/tirpc ../tests/rpc-large.c kv_store_clnt.c kv_store_xdr.c -ltirpc -o /tmp/rpc-large
          cd ..
          bash tests/rpc-extended.sh normal | tee evidence/extended-normal.txt
          make -C lab-rpc clean
          make -C lab-rpc CFLAGS="-g -I/usr/include/tirpc $(pkg-config --cflags glib-2.0) -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie" 2>&1 | tee evidence/sanitized-build.txt
          cd lab-rpc
          for kind in client large; do
            extra=''
            if [ "$kind" = client ]; then extra=kv_store_client.c; fi
            output=/tmp/rpc-large
            if [ "$kind" = client ]; then output=/tmp/rpc-test; fi
            gcc -g -I. -I/usr/include/tirpc -fsanitize=address,undefined -fno-omit-frame-pointer -no-pie ../tests/rpc-$kind.c $extra kv_store_clnt.c kv_store_xdr.c -ltirpc -o "$output"
          done
          cd ..
          ASAN_OPTIONS=detect_leaks=0:halt_on_error=1 UBSAN_OPTIONS=halt_on_error=1 bash tests/rpc-extended.sh sanitized | tee evidence/extended-sanitized.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rpc-evidence
          path: evidence/

