name: CS162 Rust gRPC
on:
  push:
    branches: [edidada/lab-grpc-rs]
  workflow_dispatch:
jobs:
  grpc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: lab-grpc-rs
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -euo pipefail
          mkdir evidence
          git rev-parse HEAD > evidence/commit.txt
          rustup show
          cargo build --locked 2>&1 | tee evidence/build.txt
          target/debug/server > evidence/server.txt 2>&1 &
          server=$!
          trap 'kill "$server" 2>/dev/null || true' EXIT
          for i in $(seq 1 100); do if (echo > /dev/tcp/127.0.0.1/10162) 2>/dev/null; then break; fi; sleep .1; done
          cargo test --locked -- --nocapture 2>&1 | tee evidence/tests.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: grpc-evidence
          path: lab-grpc-rs/evidence/
